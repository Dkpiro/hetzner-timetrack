# Adjust the listen port if 8443 is already taken on the VM — check with
# `sudo ss -tlnp` and `sudo nginx -T` before installing.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/timetrack/timetrack.crt;
    ssl_certificate_key /etc/ssl/timetrack/timetrack.key;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
