<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker — Today</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% set active = 'today' %}
{% include "_nav.html" %}
<div class="page">
    <div id="stale-banner" class="banner" style="display:none;"></div>

    <div class="card" id="timer-card">
        <div id="widget-content">
            <div class="timer-topic" id="timer-topic">Day not started</div>
            <div class="timer-display idle" id="timer-display">00:00:00</div>
            <div class="row-flex" style="justify-content:center;">
                <button class="stop" id="stop-btn" style="display:none;">Stop</button>
            </div>
        </div>
        <div class="ticket-row" id="ticket-row" style="display:none;"></div>
        <div class="row-flex day-actions">
            <button class="small" id="start-day-btn" style="display:none;">Start day</button>
            <button class="small feierabend" id="feierabend-btn" style="display:none;">Feierabend</button>
            <span id="day-finished" class="muted" style="display:none;font-size:12px;">
                <span id="day-finished-text"></span>
                <button class="small" id="reopen-day-btn">Reopen</button>
            </span>
            <span class="spacer"></span>
            <button class="small" id="popout-btn" title="Open the timer in a floating always-on-top window">⧉</button>
            <button class="small" id="notif-btn" title="Gentle notification at 15/30/45 min on a topic">🔔</button>
        </div>
    </div>

    <div class="nextup" id="nextup" style="display:none;"></div>

    <div class="picker" id="picker">
        <input type="text" id="topic-search" placeholder="Start a topic — type to search, Enter to start" autocomplete="off">
        <div class="results" id="topic-results" style="display:none;"></div>
        <div class="chips-row" id="recent-chips"></div>
    </div>

    <div class="week-nav" style="margin-top:14px;">
        <button class="small" id="day-prev" title="Previous day">&laquo;</button>
        <div class="row-flex" style="gap:6px;">
            <strong id="day-label">Today</strong>
            <input type="date" id="day-picker">
            <button class="small" id="day-today" title="Back to today">Today</button>
        </div>
        <button class="small" id="day-next" title="Next day">&raquo;</button>
    </div>
    <table id="today-table">
        <thead><tr><th>Time</th><th>Topic</th><th class="num">Spent</th><th></th></tr></thead>
        <tbody id="today-body"></tbody>
    </table>
    <div id="today-empty" class="empty" style="display:none;">Nothing logged this day.</div>

    <details class="recap" id="recap-section" style="display:none;">
        <summary id="recap-summary">Recap</summary>
        <table id="recap-table">
            <thead><tr><th>Category</th><th>Topic</th><th class="num">Time spent</th></tr></thead>
            <tbody id="recap-body"></tbody>
            <tfoot><tr><th colspan="2">Total tracked</th><th class="num" id="recap-total">0h 00m</th></tr></tfoot>
        </table>
    </details>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
TimeTracker.initToday();
</script>
</body>
</html>
