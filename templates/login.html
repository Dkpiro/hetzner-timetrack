<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrap">
    <form class="card" method="post" style="min-width:260px;">
        <h1>Time Tracker</h1>
        <input type="password" name="password" placeholder="Password" autofocus style="width:100%;margin-top:8px;">
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <button class="primary" type="submit" style="width:100%;margin-top:12px;">Log in</button>
    </form>
</div>
</body>
</html>
